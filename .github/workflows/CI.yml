name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,notebook]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and integration tests
        run: pytest
      - name: Notebook generator sync
        run: |
          generated="$(mktemp --suffix=.ipynb)"
          YIELD_CURVE_PCA_NOTEBOOK_OUTPUT="$generated" python scripts/build_notebook.py
          python scripts/check_notebook_sync.py notebooks/us_treasury_yield_curve_pca.ipynb "$generated"
      - name: Notebook smoke execution
        env:
          MPLBACKEND: Agg
        run: python scripts/execute_notebook.py notebooks/us_treasury_yield_curve_pca.ipynb --timeout 300
      - name: Standalone notebook smoke execution
        env:
          MPLBACKEND: Agg
        run: python scripts/check_standalone_notebook.py notebooks/us_treasury_yield_curve_pca.ipynb --timeout 300
      - name: Committed notebook output validation
        run: python scripts/check_executed_notebook.py notebooks/us_treasury_yield_curve_pca.ipynb
      - name: Build wheel and complete source distribution
        run: |
          python -m build
          sdist_dir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$sdist_dir"
          sdist_root="$(find "$sdist_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          (cd "$sdist_root" && python -m pytest)
      - name: Isolated wheel and sdist snapshot smoke
        run: |
          python -m venv /tmp/yc-pca-wheel-smoke
          /tmp/yc-pca-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/yc-pca-wheel-smoke/bin/python -m pip check
          python -m venv /tmp/yc-pca-sdist-smoke
          /tmp/yc-pca-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/yc-pca-sdist-smoke/bin/python -m pip check
          cd /tmp
          /tmp/yc-pca-wheel-smoke/bin/python -m yield_curve_pca \
            --source-mode snapshot --skip-forecast --accept-warnings \
            --warning-approval-id CI-SNAPSHOT-SMOKE \
            --output-dir /tmp/yc-pca-wheel-output
          /tmp/yc-pca-sdist-smoke/bin/python -m yield_curve_pca \
            --source-mode snapshot --skip-forecast --accept-warnings \
            --warning-approval-id CI-SDIST-SMOKE \
            --output-dir /tmp/yc-pca-sdist-output
          wheel_run="$(find /tmp/yc-pca-wheel-output -mindepth 1 -maxdepth 1 -type d -print -quit)"
          sdist_run="$(find /tmp/yc-pca-sdist-output -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$wheel_run" && test -n "$sdist_run"
          test "$(find "$wheel_run" -maxdepth 1 -type f | wc -l)" -eq 54
          test "$(find "$sdist_run" -maxdepth 1 -type f | wc -l)" -eq 54
          diff -qr "$wheel_run" "$sdist_run"
